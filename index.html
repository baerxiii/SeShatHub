<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SeShat Hub</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial, sans-serif;
    background:#030712;
    color:white;
}

/* LOGIN */

.login-screen{
    position:fixed;
    inset:0;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#030712;
    z-index:9999;
}

.login-card{
    width:100%;
    max-width:420px;
    padding:30px;
    border-radius:24px;
    background:rgba(255,255,255,.05);
    border:1px solid rgba(255,255,255,.1);
}

.login-card h1{
    text-align:center;
    margin-bottom:20px;
}

.login-card input{
    width:100%;
    padding:14px;
    margin-bottom:12px;
    border-radius:10px;
    border:none;
}

.login-card button{
    width:100%;
    padding:14px;
    margin-top:10px;
    border:none;
    border-radius:10px;
    cursor:pointer;
}

#authMessage{
    margin-top:15px;
    text-align:center;
}

/* DASHBOARD */

.container{
    display:none;
    padding:30px;
}

.header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:30px;
}

.card{
    background:rgba(255,255,255,.05);
    border:1px solid rgba(255,255,255,.1);
    border-radius:20px;
    padding:20px;
    margin-bottom:20px;
}
</style>
</head>
<body>

<!-- LOGIN -->

<div id="loginScreen" class="login-screen">

    <div class="login-card">

        <h1>🜃 SeShat Hub</h1>

        <input
            type="email"
            id="email"
            placeholder="Email">

        <input
            type="password"
            id="password"
            placeholder="Password">

        <button onclick="login()">
            Login
        </button>

        <button onclick="signup()">
            Create Account
        </button>

        <div id="authMessage"></div>

    </div>

</div>

<!-- DASHBOARD -->

<div class="container">

    <div class="header">
        <h1 id="greeting">Welcome</h1>

        <button onclick="logout()">
            Logout
        </button>
    </div>

    <div class="card">
        <h2>SeShat Hub Connected</h2>
        <p>Authentication is working.</p>
        <p id="userEmail"></p>
    </div>

</div>

<!-- LOAD SUPABASE FIRST -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="seshat-core.js"></script>

<script>

function getSB(){
    return window.seshat?.supabase;
}

async function signup(){

    const sb = getSB();

    if(!sb){
        document.getElementById("authMessage").innerText =
            "Supabase not loaded";
        return;
    }

    const email =
        document.getElementById("email").value;

    const password =
        document.getElementById("password").value;

    const { error } =
        await sb.auth.signUp({
            email,
            password
        });

    document.getElementById("authMessage").innerText =
        error
        ? error.message
        : "Check your email for verification.";
}

async function login(){

    const sb = getSB();

    if(!sb){
        document.getElementById("authMessage").innerText =
            "Supabase not loaded";
        return;
    }

    const email =
        document.getElementById("email").value;

    const password =
        document.getElementById("password").value;

    const { error } =
        await sb.auth.signInWithPassword({
            email,
            password
        });

    if(error){

        document.getElementById("authMessage").innerText =
            error.message;

        return;
    }

    await showDashboard();
}

async function logout(){

    const sb = getSB();

    if(sb){
        await sb.auth.signOut();
    }

    location.reload();
}

async function showDashboard(){

    const sb = getSB();

    const {
        data:{user}
    } = await sb.auth.getUser();

    document.getElementById("loginScreen")
        .style.display = "none";

    document.querySelector(".container")
        .style.display = "block";

    if(user){

        document.getElementById("userEmail")
            .innerText = user.email;

        document.getElementById("greeting")
            .innerText =
            "Welcome, " + user.email;
    }
}

async function checkSession(){

    const sb = getSB();

    if(!sb){
        console.error("Supabase not loaded");
        return;
    }

    const {
        data:{session}
    } = await sb.auth.getSession();

    if(session){
        showDashboard();
    }
}

checkSession();

</script>

</body>
</html>
