<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>SeShat Habits</title>

<script src="seshat-core.js"></script>

<style>

body{
    margin:0;
    padding:20px;
    font-family:Arial,sans-serif;
    background:
        radial-gradient(circle at top left,#2563eb,#020617 40%),
        radial-gradient(circle at bottom right,#1e293b,#020617 70%);
    color:white;
}

.container{
    max-width:1400px;
    margin:auto;
}

.header{
    margin-bottom:25px;
}

.grid{
    display:grid;
    grid-template-columns:
        repeat(auto-fit,minmax(320px,1fr));
    gap:20px;
}

.card{
    background:rgba(255,255,255,.06);
    border:1px solid rgba(255,255,255,.12);
    backdrop-filter:blur(24px);
    border-radius:24px;
    padding:24px;
}

.card h2{
    margin-top:0;
}

.counter{
    font-size:3rem;
    text-align:center;
    margin:20px 0;
    font-weight:bold;
}

.controls{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:10px;
}

button{
    border:none;
    border-radius:12px;
    padding:10px 16px;
    cursor:pointer;
}

.plus{
    background:#22c55e;
    color:white;
}

.minus{
    background:#ef4444;
    color:white;
}

.action{
    background:#2563eb;
    color:white;
}

select,
input,
textarea{
    width:100%;
    padding:10px;
    border:none;
    border-radius:12px;
    margin-top:10px;
    box-sizing:border-box;
}

textarea{
    min-height:200px;
}

.updated{
    margin-top:15px;
    font-size:.85rem;
    color:#cbd5e1;
}

.summary{
    margin-top:25px;
}

.summary ul{
    list-style:none;
    padding:0;
}

.summary li{
    margin:8px 0;
}

</style>

</head>

<body>

<div class="container">

<div class="header">

    <h1>🜃 SeShat Habits</h1>

    <p id="todayDate"></p>

</div>

<div class="grid">

<!-- CIGARETTES -->

<div class="card">

    <h2>🚬 Cigarettes</h2>

    <div class="counter"
         id="cigaretteCount">0</div>

    <div class="controls">

        <button
            class="minus"
            onclick="removeHabit('cigarette')">
            -
        </button>

        <button
            class="plus"
            onclick="addHabit('cigarette',1)">
            +
        </button>

    </div>

    <div class="updated">

        Last Updated:

        <span id="cigaretteLast">
            Never
        </span>

    </div>

</div>

<!-- JOINTS -->

<div class="card">

    <h2>🌿 Joints</h2>

    <div class="counter"
         id="jointCount">0</div>

    <div class="controls">

        <button
            class="minus"
            onclick="removeHabit('joint')">
            -
        </button>

        <button
            class="plus"
            onclick="addHabit('joint',1)">
            +
        </button>

    </div>

    <div class="updated">

        Last Updated:

        <span id="jointLast">
            Never
        </span>

    </div>

</div>

<!-- WATER -->

<div class="card">

    <h2>💧 Water</h2>

    <div class="counter"
         id="waterCount">

         0.00 L

    </div>

    <div class="controls">

        <button
            class="action"
            onclick="addHabit('water',0.25)">
            +250ml
        </button>

        <button
            class="action"
            onclick="addHabit('water',0.5)">
            +500ml
        </button>

    </div>

    <div class="updated">

        Last Updated:

        <span id="waterLast">
            Never
        </span>

    </div>

</div>

<!-- COFFEE -->

<div class="card">

    <h2>☕ Coffee</h2>

    <div class="counter"
         id="coffeeCount">

         0 oz

    </div>

    <div class="controls">

        <button class="action"
          onclick="addHabit('coffee',10)">
          Small
        </button>

        <button class="action"
          onclick="addHabit('coffee',14)">
          Medium
        </button>

        <button class="action"
          onclick="addHabit('coffee',20)">
          Large
        </button>

        <button class="action"
          onclick="addHabit('coffee',24)">
          XL
        </button>

    </div>

    <div class="updated">

        Last Updated:

        <span id="coffeeLast">
            Never
        </span>

    </div>

</div>

<!-- ALCOHOL -->

<div class="card">

    <h2>🍺 Alcohol</h2>

    <select id="alcoholType">

        <option>Beer</option>
        <option>Wine</option>
        <option>Cooler</option>
        <option>Spirits</option>
        <option>Cocktail</option>

    </select>

    <button
      class="action"
      onclick="logAlcohol()">

      Add Drink

    </button>

</div>

<!-- EXERCISE -->

<div class="card">

    <h2>🏃 Exercise</h2>

    <select id="exerciseType">

        <option>Walking</option>
        <option>Running</option>
        <option>Cycling</option>
        <option>Hiking</option>
        <option>Weight Training</option>
        <option>Yoga</option>
        <option>Stretching</option>
        <option>Other</option>

    </select>

    <input
        id="exerciseNotes"
        placeholder="Optional details">

    <select id="exerciseMinutes">

        <option value="15">15 Minutes</option>
        <option value="30">30 Minutes</option>
        <option value="45">45 Minutes</option>
        <option value="60">60 Minutes</option>
        <option value="90">90 Minutes</option>

    </select>

    <button
        class="action"
        onclick="logExercise()">

        Log Exercise

    </button>

</div>

</div>

<!-- MOOD -->

<div class="card summary">

<h2>😊 Mood</h2>

<div class="controls">

<button onclick="saveMood(1)">😢</button>
<button onclick="saveMood(2)">🙁</button>
<button onclick="saveMood(3)">😐</button>
<button onclick="saveMood(4)">🙂</button>
<button onclick="saveMood(5)">😁</button>

</div>

<p id="currentMood">
No mood recorded.
</p>

</div>

<!-- JOURNAL -->

<div class="card summary">

<h2>📓 Journal</h2>

<textarea
 id="journalText"
 placeholder="How was your day?">
</textarea>

<button
 class="action"
 onclick="saveJournal()">

 Save Journal

</button>

</div>

<!-- SUMMARY -->

<div class="card summary">

<h2>📊 Today's Summary</h2>

<ul id="summaryList">

<li>Loading...</li>

</ul>

</div>
<script>function getSB(){
    return window.seshat?.supabase;
}

let sb;
let currentUser;</script>
</div>
