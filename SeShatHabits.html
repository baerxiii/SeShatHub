<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>SeShat Habits</title>

<script src="seshat-core.js"></script>

<style>

body{
    margin:0;
    padding:20px;
    font-family:Arial,sans-serif;
    background:
        radial-gradient(circle at top left,#2563eb,#020617 40%),
        radial-gradient(circle at bottom right,#1e293b,#020617 70%);
    color:white;
}

.container{
    max-width:1400px;
    margin:auto;
}

.header{
    margin-bottom:25px;
}

.grid{
    display:grid;
    grid-template-columns:
        repeat(auto-fit,minmax(320px,1fr));
    gap:20px;
}

.card{
    background:rgba(255,255,255,.06);
    border:1px solid rgba(255,255,255,.12);
    backdrop-filter:blur(24px);
    border-radius:24px;
    padding:24px;
}

.card h2{
    margin-top:0;
}

.counter{
    font-size:3rem;
    text-align:center;
    margin:20px 0;
    font-weight:bold;
}

.controls{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:10px;
}

button{
    border:none;
    border-radius:12px;
    padding:10px 16px;
    cursor:pointer;
}

.plus{
    background:#22c55e;
    color:white;
}

.minus{
    background:#ef4444;
    color:white;
}

.action{
    background:#2563eb;
    color:white;
}

select,
input,
textarea{
    width:100%;
    padding:10px;
    border:none;
    border-radius:12px;
    margin-top:10px;
    box-sizing:border-box;
}

textarea{
    min-height:200px;
}

.updated{
    margin-top:15px;
    font-size:.85rem;
    color:#cbd5e1;
}

.summary{
    margin-top:25px;
}

.summary ul{
    list-style:none;
    padding:0;
}

.summary li{
    margin:8px 0;
}

</style>

</head>

<body>

<div class="container">

<div class="header">

    <h1>🜃 SeShat Habits</h1>

    <p id="todayDate"></p>

</div>

<div class="grid">

<!-- CIGARETTES -->

<div class="card">

    <h2>🚬 Cigarettes</h2>

    <div class="counter"
         id="cigaretteCount">0</div>

    <div class="controls">

        <button
            class="minus"
            onclick="removeHabit('cigarette')">
            -
        </button>

        <button
            class="plus"
            onclick="addHabit('cigarette',1)">
            +
        </button>

    </div>

    <div class="updated">

        Last Updated:

        <span id="cigaretteLast">
            Never
        </span>

    </div>

</div>

<!-- JOINTS -->

<div class="card">

    <h2>🌿 Joints</h2>

    <div class="counter"
         id="jointCount">0</div>

    <div class="controls">

        <button
            class="minus"
            onclick="removeHabit('joint')">
            -
        </button>

        <button
            class="plus"
            onclick="addHabit('joint',1)">
            +
        </button>

    </div>

    <div class="updated">

        Last Updated:

        <span id="jointLast">
            Never
        </span>

    </div>

</div>

<!-- WATER -->

<div class="card">

    <h2>💧 Water</h2>

    <div class="counter"
         id="waterCount">

         0.00 L

    </div>

    <div class="controls">

        <button
            class="action"
            onclick="addHabit('water',0.25)">
            +250ml
        </button>

        <button
            class="action"
            onclick="addHabit('water',0.5)">
            +500ml
        </button>

    </div>

    <div class="updated">

        Last Updated:

        <span id="waterLast">
            Never
        </span>

    </div>

</div>

<!-- COFFEE -->

<div class="card">

    <h2>☕ Coffee</h2>

    <div class="counter"
         id="coffeeCount">

         0 oz

    </div>

    <div class="controls">

        <button class="action"
          onclick="addHabit('coffee',10)">
          Small
        </button>

        <button class="action"
          onclick="addHabit('coffee',14)">
          Medium
        </button>

        <button class="action"
          onclick="addHabit('coffee',20)">
          Large
        </button>

        <button class="action"
          onclick="addHabit('coffee',24)">
          XL
        </button>

    </div>

    <div class="updated">

        Last Updated:

        <span id="coffeeLast">
            Never
        </span>

    </div>

</div>

<!-- ALCOHOL -->

<div class="card">

    <h2>🍺 Alcohol</h2>

    <select id="alcoholType">

        <option>Beer</option>
        <option>Wine</option>
        <option>Cooler</option>
        <option>Spirits</option>
        <option>Cocktail</option>

    </select>

    <button

      Add Drink

    </button>

<!-- EXERCISE -->

<div class="card">

    <select id="exerciseType">

        <option>Walking</option>

        <option>Cycling</option>
        <option>Hiking</option>

</div>

<!-- MOOD -->

<div class="controls">

<button onclick="saveMood(1)">😢</button>

</div>

<p id="currentMood">
No mood recorded.
</p>

</div>

<!-- JOURNAL -->

<div class="card summary">

<h2>📓 Journal</h2>

<textarea
 id="journalText"
 placeholder="How was your day?">
</textarea>

<button
 class="action"
 onclick="saveJournal()">

 Save Journal

</div>

<h2>📊 Today's Summary</h2>

<ul id="summaryList">

<li>Loading...</li>

</ul>

</div>

      <script>

function getSB(){
    return window.seshat?.supabase;
}

let sb;
let currentUser;

window.addEventListener("load", async () => {

    sb = getSB();

    if(!sb){
        alert("Supabase unavailable");
        return;
    }

    const {
        data:{user}
    } = await sb.auth.getUser();

    if(!user){

        alert("Please login first");

        location.href="index.html";

        return;
    }

    currentUser = user;

    document.getElementById(
        "todayDate"
    ).innerText =
    new Date().toLocaleDateString(
        undefined,
        {
            weekday:"long",
            year:"numeric",
            month:"long",
            day:"numeric"
        }
    );

    await loadHabits();

});

async function addHabit(category, quantity){

    const { error } =
    await sb
    .from("habit_logs")
    .insert({
        user_id: currentUser.id,
        category: category,
        quantity: quantity
    });

    if(error){

        console.error(error);
        return;

    }

    await loadHabits();

}

async function removeHabit(category){

    const startOfDay = new Date();

    startOfDay.setHours(
        0,0,0,0
    );

    const { data,error } =
    await sb
    .from("habit_logs")
    .select("*")
    .eq(
        "user_id",
        currentUser.id
    )
    .eq(
        "category",
        category
    )
    .gte(
        "logged_at",
        startOfDay.toISOString()
    )
    .order(
        "logged_at",
        {
            ascending:false
        }
    )
    .limit(1);

    if(error){

        console.error(error);
        return;

    }

    if(!data.length){
        return;
    }

    await sb
    .from("habit_logs")
    .delete()
    .eq(
        "id",
        data[0].id
    );

    await loadHabits();

}

async function loadHabits(){

    const startOfDay =
    new Date();

    startOfDay.setHours(
        0,0,0,0
    );

    const { data,error } =
    await sb
    .from("habit_logs")
    .select("*")
    .eq(
        "user_id",
        currentUser.id
    )
    .gte(
        "logged_at",
        startOfDay.toISOString()
    );

    if(error){

        console.error(error);
        return;

    }

    const cigarettes =
    data.filter(
        x =>
        x.category ===
        "cigarette"
    );

    const joints =
    data.filter(
        x =>
        x.category ===
        "joint"
    );

    document
    .getElementById(
        "cigaretteCount"
    )
    .innerText =
    cigarettes.length;

    document
    .getElementById(
        "jointCount"
    )
    .innerText =
    joints.length;

    const latestCig =
    cigarettes.sort(
        (a,b)=>
        new Date(
            b.logged_at
        )-
        new Date(
            a.logged_at
        )
    )[0];

    const latestJoint =
    joints.sort(
        (a,b)=>
        new Date(
            b.logged_at
        )-
        new Date(
            a.logged_at
        )
    )[0];

    document
    .getElementById(
        "cigaretteLast"
    )
    .innerText =
    latestCig
    ?
    new Date(
        latestCig.logged_at
    ).toLocaleTimeString()
    :
    "Never";

    document
    .getElementById(
        "jointLast"
    )
    .innerText =
    latestJoint
    ?
    new Date(
        latestJoint.logged_at
    ).toLocaleTimeString()
    :
    "Never";

    document
    .getElementById(
        "summaryList"
    )
    .innerHTML = `
        <li>
            🚬 Cigarettes:
            ${cigarettes.length}
        </li>

        <li>
            🌿 Joints:
            ${joints.length}
        </li>
    `;

}

</script>
</div>
