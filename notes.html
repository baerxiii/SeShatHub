<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SeShat Notes</title>
<link rel="icon" type="image/svg+xml" href="./page-icons/notes.svg">
<link rel="apple-touch-icon" href="./page-icons/notes-180.png">
<link rel="manifest" href="./notes.webmanifest">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Segoe UI',sans-serif;
    color:white;
    min-height:100vh;

    background:
        radial-gradient(circle at top left,#2563eb,#020617 40%),
        radial-gradient(circle at bottom right,#1e293b,#020617 70%);
}

.container{
    max-width:1400px;
    margin:auto;
    padding:30px;
}

.header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:25px;
}

.dashboard-btn{
    text-decoration:none;
    color:white;
    background:#2563eb;
    padding:12px 18px;
    border-radius:12px;
}

.stats{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:15px;
    margin-bottom:20px;
}

.stat-card{
    background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.12);
    border-radius:18px;
    padding:20px;
}

.card{
    background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.12);
    border-radius:20px;
    padding:25px;
    margin-bottom:20px;
}

.grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
}

input,
textarea,
select{
    width:100%;
    padding:12px;
    border:none;
    border-radius:12px;
    margin-top:10px;
}

textarea{
    min-height:180px;
    resize:vertical;
}

.btn{
    border:none;
    border-radius:10px;
    padding:10px 14px;
    cursor:pointer;
}

.add-btn{
    width:100%;
    margin-top:15px;
    background:#2563eb;
    color:white;
}

.create-form-btn{
    margin-bottom:20px;
}

.cancel-btn{
    width:100%;
    margin-top:10px;
    background:#475569;
    color:white;
}

.note-card{
    background:rgba(255,255,255,.05);
    border-radius:16px;
    padding:18px;
    margin-bottom:15px;
    border-left:4px solid #60a5fa;
}

.pinned{
    border-left:4px solid #f59e0b;
}

.note-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.badge{
    display:inline-block;
    margin-top:10px;
    padding:5px 10px;
    border-radius:10px;
    background:#334155;
}

.note-actions{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-top:15px;
}

.pin-btn{
    background:#f59e0b;
    color:white;
}

.edit-btn{
    background:#2563eb;
    color:white;
}

.delete-btn{
    background:#dc2626;
    color:white;
}

.search-box{
    margin-bottom:15px;
}

.note-content{
    margin-top:12px;
    white-space:pre-wrap;
}

@media(max-width:768px){

    .grid{
        grid-template-columns:1fr;
    }

    .header{
        flex-direction:column;
        gap:15px;
    }

}

</style>
</head>
<body>

<div class="container">

    <div class="header">

        <h1>📝 SeShat Notes</h1>

        <a href="index.html"
           class="dashboard-btn">
           Dashboard
        </a>

    </div>

    <div class="stats">

        <div class="stat-card">
            <small>Total Notes</small>
            <h2 id="noteCount">0</h2>
        </div>

        <div class="stat-card">
            <small>Pinned Notes</small>
            <h2 id="pinnedCount">0</h2>
        </div>

    </div>

    <button
        class="btn add-btn create-form-btn"
        id="showNoteForm"
        aria-controls="create-note"
        aria-expanded="false"
        onclick="openNoteForm()">

        Create Note

    </button>

    <div class="card" id="create-note" hidden>

        <h2>Create Note</h2>

        <input
            id="title"
            placeholder="Note Title">

        <div class="grid">

            <select id="category">
                <option>Work</option>
                <option>Personal</option>
                <option>Projects</option>
                <option>Reference</option>
                <option>Ideas</option>
            </select>

            <select id="pinned">
                <option value="false">Normal</option>
                <option value="true">Pinned</option>
            </select>

        </div>

        <textarea
            id="content"
            placeholder="Write your note..."></textarea>

        <button
            class="btn add-btn"
            onclick="addNote()">

            Save Note

        </button>

        <button
            class="btn cancel-btn"
            onclick="closeNoteForm()">

            Cancel

        </button>

    </div>

    <div class="card">

        <input
            id="searchBox"
            class="search-box"
            placeholder="🔍 Search Notes"
            onkeyup="loadNotes()">

        <div id="notesList"></div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="seshat-core.js"></script>

<script>

function getSB(){
    return window.seshat.supabase;
}

async function getUser(){

    const {
        data:{user}
    } = await getSB().auth.getUser();

    return user;
}

function openNoteForm(){
    document.getElementById("create-note").hidden = false;
    document.getElementById("showNoteForm").hidden = true;
    document.getElementById("showNoteForm").setAttribute("aria-expanded","true");
    document.getElementById("title").focus();
}

function closeNoteForm(){
    document.getElementById("create-note").hidden = true;
    document.getElementById("showNoteForm").hidden = false;
    document.getElementById("showNoteForm").setAttribute("aria-expanded","false");
}

async function addNote(){

    const user =
        await getUser();

    const { error } =
    await getSB()
        .from("notes")
        .insert({

            user_id:user.id,

            title:
                document.getElementById("title").value,

            content:
                document.getElementById("content").value,

            category:
                document.getElementById("category").value,

            pinned:
                document.getElementById("pinned").value === "true"

        });

    if(error){

        alert(error.message);
        return;
    }

    document.getElementById("title").value="";
    document.getElementById("content").value="";

    closeNoteForm();
    loadNotes();
}

async function editNote(note){

    const title =
        prompt("Title", note.title);

    if(title === null) return;

    const content =
        prompt("Content", note.content || "");

    if(content === null) return;

    await getSB()
        .from("notes")
        .update({
            title:title,
            content:content,
            updated_at:new Date().toISOString()
        })
        .eq("id",note.id);

    loadNotes();
}

async function togglePin(id,current){

    await getSB()
        .from("notes")
        .update({
            pinned:!current
        })
        .eq("id",id);

    loadNotes();
}

async function deleteNote(id){

    if(!confirm("Delete note?"))
        return;

    await getSB()
        .from("notes")
        .delete()
        .eq("id",id);

    loadNotes();
}

async function loadNotes(){

    const user =
        await getUser();

    if(!user) return;

    const search =
        document.getElementById("searchBox")
        .value
        .toLowerCase();

    const { data,error } =
        await getSB()
            .from("notes")
            .select("*")
            .eq("user_id",user.id)
            .order("pinned",{ascending:false})
            .order("updated_at",{ascending:false});

    if(error){
        console.error(error);
        return;
    }

    const list =
        document.getElementById("notesList");

    list.innerHTML = "";

    let total = 0;
    let pinned = 0;

    data.forEach(note=>{

        if(
            search &&
            !note.title.toLowerCase().includes(search) &&
            !(note.content || "")
                .toLowerCase()
                .includes(search)
        ){
            return;
        }

        total++;

        if(note.pinned){
            pinned++;
        }

        list.innerHTML += `
        <div class="note-card ${note.pinned ? 'pinned' : ''}">

            <div class="note-header">

                <h3>
                    ${note.pinned ? '📌 ' : ''}
                    ${note.title}
                </h3>

                <small>${note.category}</small>

            </div>

            <div class="badge">
                ${note.category}
            </div>

            <div class="note-content">
                ${note.content || ""}
            </div>

            <div class="note-actions">

                <button
                    class="btn pin-btn"
                    onclick="togglePin(${note.id},${note.pinned})">

                    ${note.pinned ? 'Unpin' : 'Pin'}

                </button>

                <button
                    class="btn edit-btn"
                    onclick="editNote({
                        id:${note.id},
                        title:'${(note.title || '').replace(/'/g,'&#39;')}',
                        content:'${(note.content || '').replace(/'/g,'&#39;')}'
                    })">

                    Edit

                </button>

                <button
                    class="btn delete-btn"
                    onclick="deleteNote(${note.id})">

                    Delete

                </button>

            </div>

        </div>
        `;
    });

    document.getElementById("noteCount").innerText =
        total;

    document.getElementById("pinnedCount").innerText =
        pinned;
}

loadNotes();

</script>

</body>
</html>
