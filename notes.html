<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SeShat Notes</title>

<link rel="stylesheet" href="item-dialog.css">
<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Segoe UI',sans-serif;
    color:white;
    min-height:100vh;

    background:
        radial-gradient(circle at top left,#2563eb,#020617 40%),
        radial-gradient(circle at bottom right,#1e293b,#020617 70%);
}

.container{
    max-width:1400px;
    margin:auto;
    padding:30px;
}

.header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:25px;
}

.dashboard-btn{
    text-decoration:none;
    color:white;
    background:#2563eb;
    padding:12px 18px;
    border-radius:12px;
}

.stats{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:15px;
    margin-bottom:20px;
}

.stat-card{
    background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.12);
    border-radius:18px;
    padding:20px;
}

.card{
    background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.12);
    border-radius:20px;
    padding:25px;
    margin-bottom:20px;
}

.grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
}

input,
textarea,
select{
    width:100%;
    padding:12px;
    border:none;
    border-radius:12px;
    margin-top:10px;
}

textarea{
    min-height:180px;
    resize:vertical;
}

.btn{
    border:none;
    border-radius:10px;
    padding:10px 14px;
    cursor:pointer;
}

.add-btn{
    width:100%;
    margin-top:15px;
    background:#2563eb;
    color:white;
}

.create-form-btn{
    margin-bottom:20px;
}

.cancel-btn{
    width:100%;
    margin-top:10px;
    background:#475569;
    color:white;
}

.note-card{
    background:rgba(255,255,255,.05);
    border-radius:16px;
    padding:18px;
    margin-bottom:15px;
    border-left:4px solid #60a5fa;
}

.pinned{
    border-left:4px solid #f59e0b;
}

.note-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.badge{
    display:inline-block;
    margin-top:10px;
    padding:5px 10px;
    border-radius:10px;
    background:#334155;
}

.note-actions{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-top:15px;
}

.pin-btn{
    background:#f59e0b;
    color:white;
}

.edit-btn{
    background:#2563eb;
    color:white;
}

.delete-btn{
    background:#dc2626;
    color:white;
}

.search-box{
    margin-bottom:15px;
}

.note-content{
    margin-top:12px;
    white-space:pre-wrap;
}

@media(max-width:768px){

    .grid{
        grid-template-columns:1fr;
    }

    .header{
        flex-direction:column;
        gap:15px;
    }

}

</style>
</head>
<body>

<div class="container">

    <div class="header">

        <h1>📝 SeShat Notes</h1>

        <a href="index.html"
           class="dashboard-btn">
           Dashboard
        </a>

    </div>

    <div class="stats">

        <div class="stat-card">
            <small>Total Notes</small>
            <h2 id="noteCount">0</h2>
        </div>

        <div class="stat-card">
            <small>Pinned Notes</small>
            <h2 id="pinnedCount">0</h2>
        </div>

    </div>

    <button
        class="btn add-btn create-form-btn"
        id="showNoteForm"
        aria-controls="create-note"
        onclick="openNoteForm()">

        Create Note

    </button>

    <dialog class="item-dialog" id="create-note" aria-labelledby="createNoteHeading">
        <form id="createNoteForm">

        <h2 id="createNoteHeading">Create Note</h2>

        <input
            id="title"
            placeholder="Note Title" aria-label="Note title" required>

        <div class="grid">

            <select id="category" aria-label="Category">
                <option>Work</option>
                <option>Personal</option>
                <option>Projects</option>
                <option>Reference</option>
                <option>Ideas</option>
            </select>

            <select id="pinned" aria-label="Pin status">
                <option value="false">Normal</option>
                <option value="true">Pinned</option>
            </select>

        </div>

        <textarea
            id="content"
            placeholder="Write your note..." aria-label="Note content"></textarea>

        <p class="dialog-message" role="alert"></p>
        <button
            class="btn add-btn"
            type="submit">

            Save Note

        </button>

        <button
            class="btn cancel-btn"
            type="button" data-cancel>

            Cancel

        </button>

        </form>
    </dialog>

    <dialog class="item-dialog" id="editNoteDialog" aria-labelledby="editNoteHeading">
        <form>
            <h2 id="editNoteHeading">Edit Note</h2>
            <label>Title <input id="editNoteTitle" required></label>
            <label>Content <textarea id="editNoteContent"></textarea></label>
            <p class="dialog-message" role="alert"></p>
            <button class="btn edit-btn" type="submit">Save changes</button>
            <button class="btn cancel-btn" type="button" data-cancel>Cancel</button>
        </form>
    </dialog>

    <div class="card">

        <input
            id="searchBox"
            class="search-box"
            placeholder="🔍 Search Notes"
            onkeyup="loadNotes()">

        <div id="notesList"></div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="seshat-core.js"></script>
<script src="item-dialog.js"></script>

<script>

function getSB(){
    return window.seshat.supabase;
}

async function getUser(){

    const {
        data:{user}
    } = await getSB().auth.getUser();

    return user;
}

const createNoteDialog = itemDialog("create-note",addNote);
function openNoteForm(){ createNoteDialog.open(); }
openDialogFromHash("#create-note",openNoteForm);

async function addNote(){

    const user =
        await getUser();
    if(!user) throw new Error("Please sign in before adding a note.");
    if(!document.getElementById("title").value.trim()) throw new Error("Note title is required.");

    const { error } =
    await getSB()
        .from("notes")
        .insert({

            user_id:user.id,

            title:
                document.getElementById("title").value,

            content:
                document.getElementById("content").value,

            category:
                document.getElementById("category").value,

            pinned:
                document.getElementById("pinned").value === "true"

        });

    if(error){

        throw error;
    }

    document.getElementById("createNoteForm").reset();
    loadNotes().catch(error => alert("Note saved, but the list could not be refreshed: " + error.message));
}

let editingNoteId;
const editNoteDialog = itemDialog("editNoteDialog",async () => {
    const title = document.getElementById("editNoteTitle").value.trim();
    if(!title) throw new Error("Note title is required.");
    const {error} = await getSB()
        .from("notes")
        .update({
            title,
            content:document.getElementById("editNoteContent").value,
            updated_at:new Date().toISOString()
        })
        .eq("id",editingNoteId);
    if(error) throw error;
    loadNotes().catch(error => alert("Note updated, but the list could not be refreshed: " + error.message));
});
function editNote(note){
    if(editNoteDialog.openState) return;
    editingNoteId = note.id;
    document.getElementById("editNoteTitle").value = note.title || "";
    document.getElementById("editNoteContent").value = note.content || "";
    editNoteDialog.open();
}

async function togglePin(id,current){

    await getSB()
        .from("notes")
        .update({
            pinned:!current
        })
        .eq("id",id);

    loadNotes();
}

async function deleteNote(id){

    if(!confirm("Delete note?"))
        return;

    await getSB()
        .from("notes")
        .delete()
        .eq("id",id);

    loadNotes();
}

async function loadNotes(){

    const user =
        await getUser();

    if(!user) return;

    const search =
        document.getElementById("searchBox")
        .value
        .toLowerCase();

    const { data,error } =
        await getSB()
            .from("notes")
            .select("*")
            .eq("user_id",user.id)
            .order("pinned",{ascending:false})
            .order("updated_at",{ascending:false});

    if(error){
        console.error(error);
        return;
    }

    const list =
        document.getElementById("notesList");

    list.innerHTML = "";

    let total = 0;
    let pinned = 0;

    data.forEach(note=>{

        if(
            search &&
            !note.title.toLowerCase().includes(search) &&
            !(note.content || "")
                .toLowerCase()
                .includes(search)
        ){
            return;
        }

        total++;

        if(note.pinned){
            pinned++;
        }

        const wrapper = document.createElement("div");
        wrapper.innerHTML = `
        <div class="note-card ${note.pinned ? 'pinned' : ''}">

            <div class="note-header">

                <h3>
                    ${note.pinned ? '📌 ' : ''}
                    ${escapeItemText(note.title)}
                </h3>

                <small>${escapeItemText(note.category)}</small>

            </div>

            <div class="badge">
                ${escapeItemText(note.category)}
            </div>

            <div class="note-content">
                ${escapeItemText(note.content)}
            </div>

            <div class="note-actions">

                <button
                    class="btn pin-btn"
                    type="button">

                    ${note.pinned ? 'Unpin' : 'Pin'}

                </button>

                <button
                    class="btn edit-btn"
                    type="button">

                    Edit

                </button>

                <button
                    class="btn delete-btn"
                    type="button">

                    Delete

                </button>

            </div>

        </div>
        `;
        wrapper.querySelector(".pin-btn").addEventListener("click",() => togglePin(note.id,note.pinned));
        wrapper.querySelector(".edit-btn").addEventListener("click",() => editNote(note));
        wrapper.querySelector(".delete-btn").addEventListener("click",() => deleteNote(note.id));
        list.append(wrapper);
    });

    document.getElementById("noteCount").innerText =
        total;

    document.getElementById("pinnedCount").innerText =
        pinned;
}

loadNotes();

</script>

</body>
</html>
