<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SeShat Document Vault</title>

<link rel="stylesheet" href="item-dialog.css">
<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Segoe UI',sans-serif;
    color:white;
    min-height:100vh;

    background:
        radial-gradient(circle at top left,#2563eb,#020617 40%),
        radial-gradient(circle at bottom right,#1e293b,#020617 70%);
}

.container{
    max-width:1400px;
    margin:auto;
    padding:30px;
}

.header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:25px;
}

.dashboard-btn{
    text-decoration:none;
    background:#2563eb;
    color:white;
    padding:12px 18px;
    border-radius:12px;
}

.stats{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:15px;
    margin-bottom:20px;
}

.stat-card{
    background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.12);
    border-radius:18px;
    padding:20px;
}

.card{
    background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.12);
    border-radius:20px;
    padding:25px;
    margin-bottom:20px;
}

.grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
}

input,
textarea,
select{
    width:100%;
    padding:12px;
    border:none;
    border-radius:12px;
    margin-top:10px;
}

textarea{
    min-height:120px;
}

.btn{
    border:none;
    border-radius:10px;
    padding:10px 14px;
    cursor:pointer;
    color:white;
}

.add-btn{
    width:100%;
    margin-top:15px;
    background:#2563eb;
}

.create-form-btn{
    margin-bottom:20px;
}

.cancel-btn{
    width:100%;
    margin-top:10px;
    background:#475569;
}

.open-btn{
    background:#16a34a;
}

.edit-btn{
    background:#f59e0b;
}

.delete-btn{
    background:#dc2626;
}

.doc-card{
    background:rgba(255,255,255,.05);
    border-left:5px solid #60a5fa;
    border-radius:16px;
    padding:18px;
    margin-bottom:15px;
}

.badge{
    display:inline-block;
    padding:5px 10px;
    border-radius:10px;
    background:#334155;
    margin-top:8px;
}

.doc-actions{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-top:15px;
}

.progress-container{

    display:none;

    margin-top:15px;
}

.progress-track{

    height:20px;

    border-radius:10px;

    overflow:hidden;

    background:#1e293b;

    margin-top:8px;
}

.progress-bar{

    width:0%;

    height:100%;

    background:#22c55e;

    transition:width .3s ease;
}

@media(max-width:768px){

    .grid{
        grid-template-columns:1fr;
    }

    .header{
        flex-direction:column;
        gap:15px;
    }
}

</style>
</head>
<body>

<div class="container">

    <div class="header">

        <h1>📂 Document Vault</h1>

        <a
            href="index.html"
            class="dashboard-btn">

            Dashboard

        </a>

    </div>

    <div class="stats">

        <div class="stat-card">
            <small>Total Documents</small>
            <h2 id="docCount">0</h2>
        </div>

        <div class="stat-card">
            <small>Vehicle Docs</small>
            <h2 id="vehicleCount">0</h2>
        </div>

        <div class="stat-card">
            <small>Insurance Docs</small>
            <h2 id="insuranceCount">0</h2>
        </div>

    </div>

    <button
        class="btn add-btn create-form-btn"
        id="showDocumentForm"
        aria-controls="create-document"
        onclick="openDocumentForm()">

        Add Document

    </button>

    <dialog class="item-dialog" id="create-document" aria-labelledby="createDocumentHeading">
        <form id="createDocumentForm">

        <h2 id="createDocumentHeading">Add Document</h2>

        <input
            id="title"
            placeholder="Document Title" aria-label="Document title" required>

        <div class="grid">

            <select id="category" aria-label="Category">

                <option>Vehicle</option>
                <option>Home</option>
                <option>Insurance</option>
                <option>Medical</option>
                <option>Taxes</option>
                <option>Receipts</option>
                <option>Manuals</option>
                <option>Other</option>

            </select>

            <input
                type="file"
                id="documentFile" aria-label="Document file" required>

        </div>

        <textarea
            id="notes"
            placeholder="Notes" aria-label="Document notes"></textarea>

        <div
            id="uploadContainer"
            class="progress-container">

            <strong>Uploading...</strong>

            <div class="progress-track">

                <div
                    id="uploadBar"
                    class="progress-bar">
                </div>

            </div>

        </div>

        <p class="dialog-message" role="alert"></p>
        <button
            class="btn add-btn"
            type="submit">

            Upload Document

        </button>

        <button
            class="btn cancel-btn"
            type="button" data-cancel>

            Cancel

        </button>

        </form>
    </dialog>

    <dialog class="item-dialog" id="editDocumentDialog" aria-labelledby="editDocumentHeading">
        <form>
            <h2 id="editDocumentHeading">Edit Document</h2>
            <label>Title <input id="editDocumentTitle" required></label>
            <label>Notes <textarea id="editDocumentNotes"></textarea></label>
            <p class="dialog-message" role="alert"></p>
            <button class="btn edit-btn" type="submit">Save changes</button>
            <button class="btn cancel-btn" type="button" data-cancel>Cancel</button>
        </form>
    </dialog>

    <div class="card">

        <input
            id="searchBox"
            placeholder="🔍 Search Documents"
            onkeyup="loadDocuments()">

        <br><br>

        <div id="documentList"></div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="seshat-core.js"></script>
<script src="item-dialog.js"></script>

<script>

function getSB(){
    return window.seshat.supabase;
}

async function getUser(){

    const {
        data:{user}
    } = await getSB().auth.getUser();

    return user;
}

const createDocumentDialog = itemDialog("create-document",addDocument);
function openDocumentForm(){ createDocumentDialog.open(); }
openDialogFromHash("#create-document",openDocumentForm);

async function addDocument(){

    const user =
        await getUser();
    if(!user) throw new Error("Please sign in before adding a document.");

    const title =
        document
        .getElementById("title")
        .value
        .trim();

    if(!title){

        throw new Error("Document title is required.");
    }

    const file =
        document
        .getElementById(
            "documentFile"
        )
        .files[0];

    if(!file){

        throw new Error("Please select a file.");
    }

    const allowedTypes = [

        "application/pdf",

        "image/png",

        "image/jpeg",

        "application/msword",

        "application/vnd.openxmlformats-officedocument.wordprocessingml.document",

        "application/vnd.ms-excel",

        "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"

    ];

    if(
        !allowedTypes.includes(
            file.type
        )
    ){

        throw new Error("Unsupported file type.");
    }

    const maxSize =
        25 * 1024 * 1024;

    if(file.size > maxSize){

        throw new Error("Maximum file size is 25 MB.");
    }

    const uploadContainer =
        document.getElementById(
            "uploadContainer"
        );

    const uploadBar =
        document.getElementById(
            "uploadBar"
        );

    uploadContainer.style.display =
        "block";

    uploadBar.style.width = "15%";

    try{
const safeFileName =
    file.name
        .replace(/[^a-zA-Z0-9._-]/g,"_");

const storagePath =
    `${user.id}/${Date.now()}_${safeFileName}`;

console.log("Storage Path:", storagePath);

    uploadBar.style.width = "40%";

    const {
        error:uploadError
    } =
    await getSB()
        .storage
        .from("documents")
        .upload(
            storagePath,
            file
        );

    if(uploadError) throw uploadError;

    uploadBar.style.width = "80%";

    const {
        error
    } =
    await getSB()
        .from("documents")
        .insert({

            user_id:user.id,

            title:title,

            category:
                document
                .getElementById("category")
                .value,

            notes:
                document
                .getElementById("notes")
                .value,

            file_name:file.name,

            storage_path:storagePath

        });

    if(error){
        const {error:cleanupError} = await getSB().storage.from("documents").remove([storagePath]);
        if(cleanupError) throw new Error(error.message + " Uploaded file cleanup failed: " + cleanupError.message);
        throw error;
    }

    uploadBar.style.width = "100%";

    }finally{
        uploadBar.style.width = "0%";
        uploadContainer.style.display = "none";
    }
    document.getElementById("createDocumentForm").reset();
    loadDocuments().catch(error => alert("Document saved, but the list could not be refreshed: " + error.message));
}

async function openDocument(path){

    const {
        data,
        error
    } =
    await getSB()
        .storage
        .from("documents")
        .createSignedUrl(
            path,
            60
        );

    if(error){

        alert(error.message);
        return;
    }

    window.open(
        data.signedUrl,
        "_blank"
    );
}

let editingDocumentId;
const editDocumentDialog = itemDialog("editDocumentDialog",async () => {
    const title = document.getElementById("editDocumentTitle").value.trim();
    if(!title) throw new Error("Document title is required.");
    const {error} = await getSB().from("documents").update({
        title,
        notes:document.getElementById("editDocumentNotes").value
    }).eq("id",editingDocumentId);
    if(error) throw error;
    loadDocuments().catch(error => alert("Document updated, but the list could not be refreshed: " + error.message));
});
function editDocument(doc){
    if(editDocumentDialog.openState) return;
    editingDocumentId = doc.id;
    document.getElementById("editDocumentTitle").value = doc.title || "";
    document.getElementById("editDocumentNotes").value = doc.notes || "";
    editDocumentDialog.open();
}

async function deleteDocument(id){

    if(
        !confirm(
            "Delete document?"
        )
    ){
        return;
    }

    await getSB()
        .from("documents")
        .delete()
        .eq("id",id);

    loadDocuments();
}

async function loadDocuments(){

    const user =
        await getUser();

    if(!user) return;

    const search =
        document
        .getElementById(
            "searchBox"
        )
        .value
        .toLowerCase();

    const {
        data,
        error
    } =
    await getSB()
        .from("documents")
        .select("*")
        .eq("user_id",user.id)
        .order(
            "created_at",
            {
              ascending:false
            }
        );

    if(error){

        console.error(error);
        return;
    }

    let vehicle = 0;
    let insurance = 0;

    const list =
        document.getElementById(
            "documentList"
        );

    list.innerHTML = "";

    data.forEach(doc=>{

        if(
            search &&
            !doc.title
                .toLowerCase()
                .includes(search)
        ){
            return;
        }

        if(doc.category==="Vehicle")
            vehicle++;

        if(doc.category==="Insurance")
            insurance++;

        const wrapper = document.createElement("div");
        wrapper.innerHTML = `

        <div class="doc-card">

            <h3>${escapeItemText(doc.title)}</h3>

            <div class="badge">

                ${escapeItemText(doc.category)}

            </div>

            <p style="margin-top:10px;">

                📄 ${escapeItemText(doc.file_name || "No File")}

            </p>

            <p style="margin-top:10px;">

                ${escapeItemText(doc.notes)}

            </p>

            <div class="doc-actions">

                <button
                    class="btn open-btn"
                    type="button">

                    Open

                </button>

                <button
    class="btn edit-btn"
    type="button">

    Edit

</button>

                <button
                    class="btn delete-btn"
                    type="button">

                    Delete

                </button>

            </div>

        </div>

        `;
        wrapper.querySelector(".open-btn").addEventListener("click",() => openDocument(doc.storage_path));
        wrapper.querySelector(".edit-btn").addEventListener("click",() => editDocument(doc));
        wrapper.querySelector(".delete-btn").addEventListener("click",() => deleteDocument(doc.id));
        list.append(wrapper);
    });

    document.getElementById(
        "docCount"
    ).textContent =
        data.length;

    document.getElementById(
        "vehicleCount"
    ).textContent =
        vehicle;

    document.getElementById(
        "insuranceCount"
    ).textContent =
        insurance;
}

loadDocuments();

</script>

</body>
</html>
