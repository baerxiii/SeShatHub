<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SeShat Tasks</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Segoe UI',sans-serif;
    color:white;
    min-height:100vh;
    background:
        radial-gradient(circle at top left,#2563eb,#020617 40%),
        radial-gradient(circle at bottom right,#1e293b,#020617 70%);
}

.container{
    max-width:1400px;
    margin:auto;
    padding:30px;
}

.header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:25px;
}

.dashboard-btn{
    text-decoration:none;
    color:white;
    background:#2563eb;
    padding:12px 18px;
    border-radius:12px;
}

.stats{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:15px;
    margin-bottom:20px;
}

.stat-card{
    background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.12);
    border-radius:18px;
    padding:20px;
}

.card{
    background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.12);
    border-radius:20px;
    padding:25px;
    margin-bottom:20px;
}

.grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
}

input,
textarea,
select{
    width:100%;
    padding:12px;
    border:none;
    border-radius:12px;
    margin-top:10px;
}

.reminder-options{
    margin-top:16px;
}

.reminder-options label{
    display:inline-flex;
    align-items:center;
    gap:6px;
    margin:10px 16px 0 0;
}

.reminder-options input[type="checkbox"]{
    width:auto;
    margin:0;
}

.reminder-options input[type="number"]{
    max-width:180px;
}

textarea{
    min-height:100px;
}

.add-btn{
    width:100%;
    margin-top:15px;
    padding:14px;
    border:none;
    border-radius:12px;
    cursor:pointer;
    background:#2563eb;
    color:white;
}

.create-task-btn{
    width:100%;
    margin-bottom:20px;
}

.cancel-btn{
    width:100%;
    margin-top:10px;
    padding:14px;
    border:none;
    border-radius:12px;
    cursor:pointer;
    background:#475569;
    color:white;
}

.task{
    border-radius:16px;
    padding:18px;
    margin-bottom:15px;
}

.priority-high{
    border-left:6px solid #ef4444;
    background:rgba(239,68,68,.08);
}

.priority-medium{
    border-left:6px solid #f59e0b;
    background:rgba(245,158,11,.08);
}

.priority-low{
    border-left:6px solid #22c55e;
    background:rgba(34,197,94,.08);
}

.overdue{
    border:2px solid #ef4444;
    box-shadow:0 0 15px rgba(239,68,68,.4);
}

.completed{
    text-decoration:line-through;
    opacity:.6;
}

.task-header{
    display:flex;
    justify-content:space-between;
}

.task-actions{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    margin-top:15px;
}

.btn{
    border:none;
    padding:10px 14px;
    border-radius:10px;
    cursor:pointer;
}

.complete-btn{
    background:#16a34a;
    color:white;
}

.edit-btn{
    background:#2563eb;
    color:white;
}

.delete-btn{
    background:#dc2626;
    color:white;
}

.category-badge{
    display:inline-block;
    margin-top:10px;
    padding:5px 10px;
    border-radius:10px;
    background:#334155;
}

.search-box{
    margin-bottom:15px;
}

@media(max-width:768px){

    .grid{
        grid-template-columns:1fr;
    }

    .header{
        flex-direction:column;
        gap:15px;
    }

}

</style>
</head>
<body>

<div class="container">

    <div class="header">

        <h1>✅ SeShat Tasks</h1>

        <a href="index.html" class="dashboard-btn">
            Dashboard
        </a>

    </div>

    <div class="stats">

        <div class="stat-card">
            <small>Open Tasks</small>
            <h2 id="openCount">0</h2>
        </div>

        <div class="stat-card">
            <small>Due Today</small>
            <h2 id="todayCount">0</h2>
        </div>

        <div class="stat-card">
            <small>High Priority</small>
            <h2 id="highCount">0</h2>
        </div>

        <div class="stat-card">
            <small>Overdue</small>
            <h2 id="overdueCount">0</h2>
        </div>

    </div>

    <button
        class="add-btn create-task-btn"
        id="showTaskForm"
        aria-controls="create-task"
        aria-expanded="false"
        onclick="openTaskForm()">

        Create Task

    </button>

    <div class="card" id="create-task" hidden>

        <h2>Create Task</h2>

        <input id="title" placeholder="Task Title">

        <textarea
            id="notes"
            placeholder="Task Notes"></textarea>

        <div class="grid">

            <select id="priority">
                <option>High</option>
                <option selected>Medium</option>
                <option>Low</option>
            </select>

            <select id="category">
                <option>Work</option>
                <option>Personal</option>
                <option>Home</option>
                <option>Finance</option>
                <option>Health</option>
                <option>Projects</option>
            </select>

            <input type="date" id="start_date">

            <input type="date" id="due_date">

        </div>

        <fieldset class="reminder-options">
            <legend>Reminders (task due date defaults to 9:00 a.m. local time)</legend>
            <label><input type="checkbox" name="reminder-offset" value="1440" checked> 1 day before</label>
            <label><input type="checkbox" name="reminder-offset" value="60"> 1 hour before</label>
            <label><input type="checkbox" name="reminder-offset" value="15"> 15 minutes before</label>
            <label for="customReminderMinutes">Custom minutes before</label>
            <input id="customReminderMinutes" type="number" min="1" max="525600" step="1" placeholder="e.g. 30">
        </fieldset>

        <button class="add-btn" onclick="addTask()">
            Add Task
        </button>

        <button class="cancel-btn" onclick="closeTaskForm()">
            Cancel
        </button>

    </div>

    <div class="card">

        <input
            id="searchBox"
            class="search-box"
            placeholder="🔍 Search Tasks"
            onkeyup="loadTasks()">

        <select
            id="filter"
            onchange="loadTasks()">

            <option value="all">All</option>
            <option value="open">Open</option>
            <option value="completed">Completed</option>

        </select>

        <br><br>

        <div id="taskList"></div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="seshat-core.js"></script>

<script>

function getSB(){
    return window.seshat.supabase;
}

async function getUser(){

    const {
        data:{user}
    } = await getSB().auth.getUser();

    return user;
}

function openTaskForm(){
    document.getElementById("create-task").hidden = false;
    document.getElementById("showTaskForm").hidden = true;
    document.getElementById("showTaskForm").setAttribute("aria-expanded","true");
    document.getElementById("title").focus();
}

function closeTaskForm(){
    document.getElementById("create-task").hidden = true;
    document.getElementById("showTaskForm").hidden = false;
    document.getElementById("showTaskForm").setAttribute("aria-expanded","false");
}

async function addTask(){

    const user = await getUser();
    if(!user){
        alert("Please sign in before adding a task.");
        return;
    }

    const title = document.getElementById("title").value.trim();
    if(!title){
        alert("Task title is required.");
        return;
    }

    const dueDate = document.getElementById("due_date").value;

    const { data:task, error } =
    await getSB()
        .from('tasks')
        .insert({

            user_id:user.id,

            title,

            notes:
            document.getElementById("notes").value,

            priority:
            document.getElementById("priority").value,

            category:
            document.getElementById("category").value,

            start_date:
            document.getElementById("start_date").value || null,

            due_date:
            dueDate || null

        })
        .select("id")
        .single();

    if(error){

        alert(error.message);
        return;
    }

    if(dueDate){
        try{
            await window.seshat.scheduleReminders({
                itemType:"task",
                itemId:task.id,
                dueDate,
                dueTime:"09:00",
                url:"tasks.html",
                offsets:window.seshat.readReminderOffsets()
            });
        }catch(error){
            alert("Task saved, but its reminders could not be scheduled: " + error.message);
        }
    }

    document.getElementById("title").value="";
    document.getElementById("notes").value="";
    document.getElementById("due_date").value="";
    closeTaskForm();
    loadTasks();
}

async function editTask(id,current){

    const updated =
    prompt("Edit Task",current);

    if(!updated) return;

    await getSB()
        .from("tasks")
        .update({
            title:updated
        })
        .eq("id",id);

    loadTasks();
}

async function toggleTask(id,current){

    await getSB()
        .from("tasks")
        .update({
            completed:!current
        })
        .eq("id",id);

    loadTasks();
}

async function deleteTask(id){

    if(!confirm("Delete task?"))
        return;

    const {error} = await getSB()
        .from("tasks")
        .delete()
        .eq("id",id);

    if(error){
        alert(error.message);
        return;
    }

    try{
        await window.seshat.clearReminders("task",id);
    }catch(error){
        console.error("Unable to clear task reminders:",error);
    }

    loadTasks();
}

async function loadTasks(){

    const user = await getUser();

    if(!user) return;

    const { data } =
    await getSB()
        .from("tasks")
        .select("*")
        .eq("user_id",user.id)
        .order("created_at",{ascending:false});

    const today =
        new Date().toISOString().split("T")[0];

    const search =
        document.getElementById("searchBox")
        .value
        .toLowerCase();

    const filter =
        document.getElementById("filter").value;

    let open=0;
    let high=0;
    let overdue=0;
    let dueToday=0;

    const taskList =
        document.getElementById("taskList");

    taskList.innerHTML="";

    data.forEach(task=>{

        if(
            search &&
            !task.title.toLowerCase()
            .includes(search)
        ){
            return;
        }

        if(
            filter==="open" &&
            task.completed
        ){
            return;
        }

        if(
            filter==="completed" &&
            !task.completed
        ){
            return;
        }

        if(!task.completed)
            open++;

        if(task.priority==="High")
            high++;

        if(
            task.due_date &&
            task.due_date < today &&
            !task.completed
        ){
            overdue++;
        }

        if(
            task.due_date === today &&
            !task.completed
        ){
            dueToday++;
        }

        const overdueClass =
            task.due_date &&
            task.due_date < today &&
            !task.completed
            ? "overdue"
            : "";

        const priorityClass =
            "priority-" +
            task.priority.toLowerCase();

        taskList.innerHTML += `
        <div class="task ${priorityClass} ${overdueClass}">

            <div class="task-header">

                <h3 class="${
                    task.completed
                    ? "completed"
                    : ""
                }">
                    ${task.title}
                </h3>

                <strong>
                    ${task.priority}
                </strong>

            </div>

            <div class="category-badge">
                ${task.category}
            </div>

            <p style="margin-top:10px;">
                ${task.notes || ""}
            </p>

            <p style="margin-top:10px;">
                📅 Due:
                ${task.due_date || "None"}
            </p>

            <div class="task-actions">

                <button
                    class="btn complete-btn"
                    onclick="toggleTask(${task.id},${task.completed})">

                    ${
                        task.completed
                        ? "Undo"
                        : "Complete"
                    }

                </button>

                <button
                    class="btn edit-btn"
                    onclick="editTask(${task.id},'${task.title.replace(/'/g,"&#39;")}')">

                    Edit

                </button>

                <button
                    class="btn delete-btn"
                    onclick="deleteTask(${task.id})">

                    Delete

                </button>

            </div>

        </div>
        `;
    });

    document.getElementById("openCount").innerText=open;
    document.getElementById("todayCount").innerText=dueToday;
    document.getElementById("highCount").innerText=high;
    document.getElementById("overdueCount").innerText=overdue;

}

loadTasks();

</script>

</body>
</html>
