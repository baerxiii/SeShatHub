<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>SeShat Tasks</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Segoe UI,sans-serif;
    color:white;
    min-height:100vh;

    background:
    radial-gradient(circle at top left,#2563eb,#020617 40%),
    radial-gradient(circle at bottom right,#1e293b,#020617 70%);
}

.container{
    max-width:1200px;
    padding:30px;
    margin:auto;
}

.header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:30px;
}

.btn{
    padding:12px 18px;
    border:none;
    border-radius:12px;
    cursor:pointer;
}

.dashboard-btn{
    background:#2563eb;
    color:white;
    text-decoration:none;
}

.card{
    background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.12);
    backdrop-filter:blur(20px);
    border-radius:20px;
    padding:25px;
    margin-bottom:20px;
}

.grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
}

input,
textarea,
select{
    width:100%;
    padding:12px;
    border:none;
    border-radius:12px;
    margin-top:8px;
}

textarea{
    min-height:90px;
}

.add-btn{
    width:100%;
    margin-top:15px;
    background:#2563eb;
    color:white;
}

.task{
    background:rgba(255,255,255,.05);
    border-radius:15px;
    padding:18px;
    margin-top:15px;
}

.task-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.priority-high{
    color:#ef4444;
}

.priority-medium{
    color:#f59e0b;
}

.priority-low{
    color:#22c55e;
}

.task-actions{
    margin-top:15px;
    display:flex;
    gap:10px;
}

.complete-btn{
    background:#16a34a;
    color:white;
}

.delete-btn{
    background:#dc2626;
    color:white;
}

.completed{
    opacity:.6;
    text-decoration:line-through;
}

small{
    color:#cbd5e1;
}

@media(max-width:768px){

    .grid{
        grid-template-columns:1fr;
    }

}

</style>
</head>
<body>

<div class="container">

    <div class="header">

        <h1>✅ SeShat Tasks</h1>

        <a href="index.html"
           class="btn dashboard-btn">
            Dashboard
        </a>

    </div>

    <div class="card">

        <h2>New Task</h2>

        <input
            id="title"
            placeholder="Task Title">

        <textarea
            id="notes"
            placeholder="Notes"></textarea>

        <div class="grid">

            <select id="priority">
                <option>High</option>
                <option selected>Medium</option>
                <option>Low</option>
            </select>

            <input
                type="date"
                id="duedate">

        </div>

        <button
            class="btn add-btn"
            onclick="addTask()">
            Add Task
        </button>

    </div>

    <div class="card">

        <h2>My Tasks</h2>

        <div id="taskList"></div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="seshat-core.js"></script>

<script>

function getSB(){
    return window.seshat.supabase;
}

async function getUser(){

    const {
        data:{user}
    } = await getSB().auth.getUser();

    if(!user){

        window.location.href="index.html";
        return null;
    }

    return user;
}

async function addTask(){

    const user = await getUser();

    if(!user) return;

    const title =
        document.getElementById("title").value;

    if(!title.trim()) return;

    await getSB()
        .from("tasks")
        .insert({

            user_id:user.id,

            title:title,

            notes:
            document.getElementById("notes").value,

            priority:
            document.getElementById("priority").value,

            due_date:
            document.getElementById("duedate").value

        });

    document.getElementById("title").value="";
    document.getElementById("notes").value="";

    loadTasks();
}

async function loadTasks(){

    const user =
        await getUser();

    if(!user) return;

    const {data,error} =
        await getSB()
            .from("tasks")
            .select("*")
            .eq("user_id",user.id)
            .order("created_at",
            {ascending:false});

    if(error){

        console.error(error);
        return;
    }

    const taskList =
        document.getElementById("taskList");

    taskList.innerHTML="";

    data.forEach(task=>{

        const priorityClass =
            task.priority
            ? "priority-" +
              task.priority.toLowerCase()
            : "priority-medium";

        taskList.innerHTML += `

        <div class="task">

            <div class="task-header">

                <h3 class="${
                    task.completed
                    ? "completed"
                    : ""
                }">
                    ${task.title}
                </h3>

                <strong class="${priorityClass}">
                    ${task.priority || "Medium"}
                </strong>

            </div>

            <p>${task.notes || ""}</p>

            <br>

            <small>
                Due:
                ${task.due_date || "No deadline"}
            </small>

            <div class="task-actions">

                <button
                    class="btn complete-btn"
                    onclick="toggleTask(${task.id},${task.completed})">

                    ${
                        task.completed
                        ? "Undo"
                        : "Complete"
                    }

                </button>

                <button
                    class="btn delete-btn"
                    onclick="deleteTask(${task.id})">

                    Delete

                </button>

            </div>

        </div>
        `;
    });

}

async function toggleTask(id,current){

    await getSB()
        .from("tasks")
        .update({
            completed:!current
        })
        .eq("id",id);

    loadTasks();
}

async function deleteTask(id){

    if(!confirm("Delete task?"))
        return;

    await getSB()
        .from("tasks")
        .delete()
  ks();

</script>

</body>
</html>
