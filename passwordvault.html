<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SeShat Password Vault</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Segoe UI',sans-serif;
    color:white;
    min-height:100vh;

    background:
        radial-gradient(circle at top left,#2563eb,#020617 40%),
        radial-gradient(circle at bottom right,#1e293b,#020617 70%);
}

.container{
    max-width:1400px;
    margin:auto;
    padding:30px;
}

.header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:25px;
}

.dashboard-btn{
    text-decoration:none;
    background:#2563eb;
    color:white;
    padding:12px 18px;
    border-radius:12px;
}

.card{
    background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.12);
    border-radius:20px;
    padding:25px;
    margin-bottom:20px;
}

.grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
}

input,
textarea,
select{
    width:100%;
    padding:12px;
    border:none;
    border-radius:12px;
    margin-top:10px;
}

textarea{
    min-height:90px;
}

.btn{
    border:none;
    border-radius:10px;
    padding:10px 14px;
    cursor:pointer;
}

.add-btn{
    width:100%;
    background:#2563eb;
    color:white;
    margin-top:15px;
}

.generate-btn{
    width:100%;
    margin-top:10px;
    background:#16a34a;
    color:white;
}

.vault-entry{
    background:rgba(255,255,255,.05);
    border-radius:16px;
    padding:18px;
    margin-bottom:15px;
}

.entry-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.entry-actions{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-top:15px;
}

.show-btn{
    background:#16a34a;
    color:white;
}

.copy-btn{
    background:#2563eb;
    color:white;
}

.edit-btn{
    background:#f59e0b;
    color:white;
}

.delete-btn{
    background:#dc2626;
    color:white;
}

.badge{
    display:inline-block;
    margin-top:10px;
    padding:5px 10px;
    border-radius:10px;
    background:#334155;
}

.hidden-password{
    letter-spacing:3px;
}

.search-box{
    margin-bottom:15px;
}

@media(max-width:768px){

    .grid{
        grid-template-columns:1fr;
    }

    .header{
        flex-direction:column;
        gap:15px;
    }

}

</style>
</head>
<body>

<div class="container">

    <div class="header">

        <h1>🔐 Password Vault</h1>

        <a href="index.html"
           class="dashboard-btn">

            Dashboard

        </a>

    </div>

    <div class="card">

        <h2>Add Password</h2>

        <div class="grid">

            <input
                id="website"
                placeholder="Website">

            <input
                id="username"
                placeholder="Username">

            <input
                id="password_value"
                placeholder="Password">

            <select id="category">

                <option>Work</option>
                <option>Personal</option>
                <option>Finance</option>
                <option>Email</option>
                <option>Streaming</option>
                <option>Other</option>

            </select>

        </div>

        <textarea
            id="notes"
            placeholder="Notes"></textarea>

        <button
            class="btn generate-btn"
            onclick="generatePassword()">

            🎲 Generate Password

        </button>

        <button
            class="btn add-btn"
            onclick="addPassword()">

            Save Password

        </button>

    </div>

    <div class="card">

        <input
            id="searchBox"
            class="search-box"
            placeholder="🔍 Search"
            onkeyup="loadPasswords()">

        <div id="vaultList"></div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="seshat-core.js"></script>

<script>

function getSB(){
    return window.seshat.supabase;
}

async function getUser(){

    const {
        data:{user}
    } = await getSB().auth.getUser();

    return user;
}

function generatePassword(){

    const chars =
        "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789!@#$%^&*";

    let pw = "";

    for(let i=0;i<16;i++){

        pw += chars.charAt(
            Math.floor(Math.random()*chars.length)
        );
    }

    document.getElementById(
        "password_value"
    ).value = pw;
}

async function addPassword(){

    const user =
        await getUser();

    const { error } =
    await getSB()
        .from("passwords")
        .insert({

            user_id:user.id,

            website:
                document.getElementById("website").value,

            username:
                document.getElementById("username").value,

            password_value:
                document.getElementById("password_value").value,

            category:
                document.getElementById("category").value,

            notes:
                document.getElementById("notes").value

        });

    if(error){

        alert(error.message);
        return;
    }

    document.getElementById("website").value="";
    document.getElementById("username").value="";
    document.getElementById("password_value").value="";
    document.getElementById("notes").value="";

    loadPasswords();
}

async function editPassword(entry){

    const website =
        prompt("Website",entry.website);

    if(website===null) return;

    const username =
        prompt("Username",entry.username || "");

    if(username===null) return;

    const password_value =
        prompt("Password",entry.password_value || "");

    if(password_value===null) return;

    const category =
        prompt("Category",entry.category || "Other");

    if(category===null) return;

    const notes =
        prompt("Notes",entry.notes || "");

    if(notes===null) return;

    await getSB()
        .from("passwords")
        .update({

            website,
            username,
            password_value,
            category,
            notes

        })
        .eq("id",entry.id);

    loadPasswords();
}

async function deletePassword(id){

    if(!confirm("Delete password?"))
        return;

    await getSB()
        .from("passwords")
        .delete()
        .eq("id",id);

    loadPasswords();
}

function copyText(value){

    navigator.clipboard.writeText(value);

    alert("Copied");
}

function togglePassword(id,password){

    const el =
        document.getElementById(
            "pw-" + id
        );

    if(el.innerText.includes("•")){

        el.innerText = password;

    }else{

        el.innerText =
            "••••••••••••••••";
    }
}

async function loadPasswords(){

    const user =
        await getUser();

    if(!user) return;

    const search =
        document.getElementById("searchBox")
        .value
        .toLowerCase();

    const { data } =
    await getSB()
        .from("passwords")
        .select("*")
        .eq("user_id",user.id)
        .order("website");

    const list =
        document.getElementById("vaultList");

    list.innerHTML="";

    data.forEach(entry=>{

        if(
            search &&
            !entry.website
                .toLowerCase()
                .includes(search)
        ){
            return;
        }

        list.innerHTML += `

        <div class="vault-entry">

            <div class="entry-header">

                <h3>${entry.website}</h3>

                <strong>
                    ${entry.username || ""}
                </strong>

            </div>

            <div class="badge">

                ${entry.category || "Other"}

            </div>

            <p style="margin-top:10px">

                <span
                    id="pw-${entry.id}"
                    class="hidden-password">

                    ••••••••••••••••

                </span>

            </p>

            <p style="margin-top:10px">

                ${entry.notes || ""}

            </p>

            <div class="entry-actions">

                <button
                    class="btn show-btn"
                    onclick="togglePassword(${entry.id},'${(entry.password_value || '').replace(/'/g,'&#39;')}')">

                    Show

                </button>

                <button
                    class="btn copy-btn"
                    onclick="copyText('${(entry.password_value || '').replace(/'/g,'&#39;')}')">

                    Copy Password

                </button>

                <button
                    class="btn copy-btn"
                    onclick="copyText('${(entry.username || '').replace(/'/g,'&#39;')}')">

                    Copy Username

                </button>

                <button
                    class="btn edit-btn"
                    onclick='editPassword(${JSON.stringify({
                        id:"__ID__",
                        website:"__WEBSITE__",
                        username:"__USERNAME__",
                        password_value:"__PASSWORD__",
                        category:"__CATEGORY__",
                        notes:"__NOTES__"
                    })})'>

                    Edit

                </button>

                <button
                    class="btn delete-btn"
                    onclick="deletePassword(${entry.id})">

                    Delete

                </button>

            </div>

        </div>

        `
        .replace('__ID__',entry.id)
        .replace('__WEBSITE__',(entry.website || '').replace(/"/g,'&quot;'))
        .replace('__USERNAME__',(entry.username || '').replace(/"/g,'&quot;'))
        .replace('__PASSWORD__',(entry.password_value || '').replace(/"/g,'&quot;'))
        .replace('__CATEGORY__',(entry.category || '').replace(/"/g,'&quot;'))
        .replace('__NOTES__',(entry.notes || '').replace(/"/g,'&quot;'));
    });

}

loadPasswords();

</script>

</body>
</html>
