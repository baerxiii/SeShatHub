<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SeShat Password Vault</title>

<link rel="stylesheet" href="item-dialog.css">
<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Segoe UI',sans-serif;
    color:white;
    min-height:100vh;

    background:
        radial-gradient(circle at top left,#2563eb,#020617 40%),
        radial-gradient(circle at bottom right,#1e293b,#020617 70%);
}

.container{
    max-width:1400px;
    margin:auto;
    padding:30px;
}

.header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:25px;
}

.dashboard-btn{
    text-decoration:none;
    background:#2563eb;
    color:white;
    padding:12px 18px;
    border-radius:12px;
}

.card{
    background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.12);
    border-radius:20px;
    padding:25px;
    margin-bottom:20px;
}

.grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
}

input,
textarea,
select{
    width:100%;
    padding:12px;
    border:none;
    border-radius:12px;
    margin-top:10px;
}

textarea{
    min-height:90px;
}

.btn{
    border:none;
    border-radius:10px;
    padding:10px 14px;
    cursor:pointer;
}

.add-btn{
    width:100%;
    background:#2563eb;
    color:white;
    margin-top:15px;
}

.create-form-btn{
    margin-bottom:20px;
}

.cancel-btn{
    width:100%;
    margin-top:10px;
    background:#475569;
    color:white;
}

.generate-btn{
    width:100%;
    margin-top:10px;
    background:#16a34a;
    color:white;
}

.vault-entry{
    background:rgba(255,255,255,.05);
    border-radius:16px;
    padding:18px;
    margin-bottom:15px;
}

.entry-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.entry-actions{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-top:15px;
}

.show-btn{
    background:#16a34a;
    color:white;
}

.copy-btn{
    background:#2563eb;
    color:white;
}

.edit-btn{
    background:#f59e0b;
    color:white;
}

.delete-btn{
    background:#dc2626;
    color:white;
}

.badge{
    display:inline-block;
    margin-top:10px;
    padding:5px 10px;
    border-radius:10px;
    background:#334155;
}

.hidden-password{
    letter-spacing:3px;
}

.search-box{
    margin-bottom:15px;
}

@media(max-width:768px){

    .grid{
        grid-template-columns:1fr;
    }

    .header{
        flex-direction:column;
        gap:15px;
    }

}

</style>
</head>
<body>

<div class="container">

    <div class="header">

        <h1>🔐 Password Vault</h1>

        <a href="index.html"
           class="dashboard-btn">

            Dashboard

        </a>

    </div>

    <button
        class="btn add-btn create-form-btn"
        id="showPasswordForm"
        aria-controls="add-password"
        onclick="openPasswordForm()">

        Add Password

    </button>

    <dialog class="item-dialog" id="add-password" aria-labelledby="createPasswordHeading">
        <form id="createPasswordForm">

        <h2 id="createPasswordHeading">Add Password</h2>

        <div class="grid">

            <input
                id="website"
                placeholder="Website" aria-label="Website" required>

            <input
                id="username"
                placeholder="Username" aria-label="Username">

            <input
                id="password_value"
                placeholder="Password" aria-label="Password">

            <select id="category" aria-label="Category">

                <option>Work</option>
                <option>Personal</option>
                <option>Finance</option>
                <option>Email</option>
                <option>Streaming</option>
                <option>Other</option>

            </select>

        </div>

        <textarea
            id="notes"
            placeholder="Notes" aria-label="Password notes"></textarea>

        <button
            class="btn generate-btn"
            type="button" onclick="generatePassword()">

            🎲 Generate Password

        </button>

        <p class="dialog-message" role="alert"></p>
        <button
            class="btn add-btn"
            type="submit">

            Save Password

        </button>

        <button
            class="btn cancel-btn"
            type="button" data-cancel>

            Cancel

        </button>

        </form>
    </dialog>

    <dialog class="item-dialog" id="editPasswordDialog" aria-labelledby="editPasswordHeading">
        <form>
            <h2 id="editPasswordHeading">Edit Password</h2>
            <label>Website <input id="editWebsite" required></label>
            <label>Username <input id="editUsername"></label>
            <label>Password <input id="editPasswordValue"></label>
            <label>Category <input id="editPasswordCategory"></label>
            <label>Notes <textarea id="editPasswordNotes"></textarea></label>
            <p class="dialog-message" role="alert"></p>
            <button class="btn edit-btn" type="submit">Save changes</button>
            <button class="btn cancel-btn" type="button" data-cancel>Cancel</button>
        </form>
    </dialog>

    <div class="card">

        <input
            id="searchBox"
            class="search-box"
            placeholder="🔍 Search"
            onkeyup="loadPasswords()">

        <div id="vaultList"></div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="seshat-core.js"></script>
<script src="item-dialog.js"></script>

<script>

function getSB(){
    return window.seshat.supabase;
}

async function getUser(){

    const {
        data:{user}
    } = await getSB().auth.getUser();

    return user;
}

const createPasswordDialog = itemDialog("add-password",addPassword);
function openPasswordForm(){ createPasswordDialog.open(); }
openDialogFromHash("#add-password",openPasswordForm);

function generatePassword(){

    const chars =
        "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789!@#$%^&*";

    let pw = "";

    for(let i=0;i<16;i++){

        pw += chars.charAt(
            Math.floor(Math.random()*chars.length)
        );
    }

    document.getElementById(
        "password_value"
    ).value = pw;
}

async function addPassword(){

    const user =
        await getUser();
    if(!user) throw new Error("Please sign in before adding a password.");
    if(!document.getElementById("website").value.trim()) throw new Error("Website is required.");

    const { error } =
    await getSB()
        .from("passwords")
        .insert({

            user_id:user.id,

            website:
                document.getElementById("website").value,

            username:
                document.getElementById("username").value,

            password_value:
                document.getElementById("password_value").value,

            category:
                document.getElementById("category").value,

            notes:
                document.getElementById("notes").value

        });

    if(error){

        throw error;
    }

    document.getElementById("createPasswordForm").reset();
    loadPasswords().catch(error => alert("Password saved, but the list could not be refreshed: " + error.message));
}

let editingPasswordId;
const editPasswordDialog = itemDialog("editPasswordDialog",async () => {
    const website = document.getElementById("editWebsite").value.trim();
    if(!website) throw new Error("Website is required.");
    const {error} = await getSB()
        .from("passwords")
        .update({
            website,
            username:document.getElementById("editUsername").value,
            password_value:document.getElementById("editPasswordValue").value,
            category:document.getElementById("editPasswordCategory").value,
            notes:document.getElementById("editPasswordNotes").value
        })
        .eq("id",editingPasswordId);
    if(error) throw error;
    loadPasswords().catch(error => alert("Password updated, but the list could not be refreshed: " + error.message));
});
function editPassword(entry){
    if(editPasswordDialog.openState) return;
    editingPasswordId = entry.id;
    document.getElementById("editWebsite").value = entry.website || "";
    document.getElementById("editUsername").value = entry.username || "";
    document.getElementById("editPasswordValue").value = entry.password_value || "";
    document.getElementById("editPasswordCategory").value = entry.category || "Other";
    document.getElementById("editPasswordNotes").value = entry.notes || "";
    editPasswordDialog.open();
}

async function deletePassword(id){

    if(!confirm("Delete password?"))
        return;

    await getSB()
        .from("passwords")
        .delete()
        .eq("id",id);

    loadPasswords();
}

function copyText(value){

    navigator.clipboard.writeText(value);

    alert("Copied");
}

function togglePassword(id,password){

    const el =
        document.getElementById(
            "pw-" + id
        );

    if(el.innerText.includes("•")){

        el.innerText = password;

    }else{

        el.innerText =
            "••••••••••••••••";
    }
}

async function loadPasswords(){

    const user =
        await getUser();

    if(!user) return;

    const search =
        document.getElementById("searchBox")
        .value
        .toLowerCase();

    const { data } =
    await getSB()
        .from("passwords")
        .select("*")
        .eq("user_id",user.id)
        .order("website");

    const list =
        document.getElementById("vaultList");

    list.innerHTML="";

    data.forEach(entry=>{

        if(
            search &&
            !entry.website
                .toLowerCase()
                .includes(search)
        ){
            return;
        }

        const wrapper = document.createElement("div");
        wrapper.innerHTML = `

        <div class="vault-entry">

            <div class="entry-header">

                <h3>${escapeItemText(entry.website)}</h3>

                <strong>
                    ${escapeItemText(entry.username)}
                </strong>

            </div>

            <div class="badge">

                ${escapeItemText(entry.category || "Other")}

            </div>

            <p style="margin-top:10px">

                <span
                    id="pw-${escapeItemText(entry.id)}"
                    class="hidden-password">

                    ••••••••••••••••

                </span>

            </p>

            <p style="margin-top:10px">

                ${escapeItemText(entry.notes)}

            </p>

            <div class="entry-actions">

                <button
                    class="btn show-btn"
                    type="button">

                    Show

                </button>

                <button
                    class="btn copy-btn"
                    type="button">

                    Copy Password

                </button>

                <button
                    class="btn copy-btn"
                    type="button">

                    Copy Username

                </button>

                <button
                    class="btn edit-btn"
                    type="button">

                    Edit

                </button>

                <button
                    class="btn delete-btn"
                    type="button">

                    Delete

                </button>

            </div>

        </div>

        `;
        wrapper.querySelector(".show-btn").addEventListener("click",() => togglePassword(entry.id,entry.password_value || ""));
        const copyButtons = wrapper.querySelectorAll(".copy-btn");
        copyButtons[0].addEventListener("click",() => copyText(entry.password_value || ""));
        copyButtons[1].addEventListener("click",() => copyText(entry.username || ""));
        wrapper.querySelector(".edit-btn").addEventListener("click",() => editPassword(entry));
        wrapper.querySelector(".delete-btn").addEventListener("click",() => deletePassword(entry.id));
        list.append(wrapper);
    });

}

loadPasswords();

</script>

</body>
</html>
