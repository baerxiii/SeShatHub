<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SeShat Password Vault</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Segoe UI',sans-serif;
    color:white;
    min-height:100vh;

    background:
        radial-gradient(circle at top left,#2563eb,#020617 40%),
        radial-gradient(circle at bottom right,#1e293b,#020617 70%);
}

.container{
    max-width:1300px;
    margin:auto;
    padding:30px;
}

.header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:25px;
}

.dashboard-btn{
    text-decoration:none;
    background:#2563eb;
    color:white;
    padding:12px 18px;
    border-radius:12px;
}

.card{
    background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.12);
    border-radius:20px;
    padding:25px;
    margin-bottom:20px;
}

.grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
}

input,
textarea,
select{
    width:100%;
    padding:12px;
    border:none;
    border-radius:12px;
    margin-top:10px;
}

textarea{
    min-height:90px;
}

button{
    cursor:pointer;
}

.add-btn{
    width:100%;
    margin-top:15px;
    padding:12px;
    border:none;
    border-radius:12px;
    background:#2563eb;
    color:white;
}

.vault-entry{
    background:rgba(255,255,255,.05);
    border-radius:15px;
    padding:18px;
    margin-bottom:15px;
}

.entry-header{
    display:flex;
    justify-content:space-between;
}

.entry-actions{
    display:flex;
    gap:10px;
    margin-top:12px;
}

.action-btn{
    padding:8px 12px;
    border:none;
    border-radius:8px;
    color:white;
}

.show-btn{
    background:#16a34a;
}

.copy-btn{
    background:#2563eb;
}

.delete-btn{
    background:#dc2626;
}

.badge{
    display:inline-block;
    background:#334155;
    padding:5px 10px;
    border-radius:8px;
    margin-top:10px;
}

.hidden-password{
    letter-spacing:3px;
}

</style>
</head>

<body>

<div class="container">

    <div class="header">

        <h1>🔐 SeShat Password Vault</h1>

        <a href="index.html"
           class="dashboard-btn">

            Dashboard

        </a>

    </div>

    <div class="card">

        <h2>Add Password</h2>

        <div class="grid">

            <input
                id="website"
                placeholder="Website">

            <input
                id="username"
                placeholder="Username or Email">

            <input
                id="password_value"
                placeholder="Password">

            <select id="category">

                <option>Work</option>
                <option>Personal</option>
                <option>Finance</option>
                <option>Shopping</option>
                <option>Other</option>

            </select>

        </div>

        <textarea
            id="notes"
            placeholder="Notes"></textarea>

        <button
            class="add-btn"
            onclick="addPassword()">

            Save Password

        </button>

    </div>

    <div class="card">

        <input
            id="searchBox"
            placeholder="🔍 Search"
            onkeyup="loadPasswords()">

        <br><br>

        <div id="vaultList"></div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="seshat-core.js"></script>

<script>

function getSB(){
    return window.seshat.supabase;
}

async function getUser(){

    const {
        data:{user}
    } = await getSB().auth.getUser();

    return user;
}

async function addPassword(){

    const user =
        await getUser();

    const { error } =
    await getSB()
        .from("passwords")
        .insert({

            user_id:user.id,

            website:
                document.getElementById("website").value,

            username:
                document.getElementById("username").value,

            password_value:
                document.getElementById("password_value").value,

            category:
                document.getElementById("category").value,

            notes:
                document.getElementById("notes").value

        });

    if(error){

        alert(error.message);
        return;
    }

    loadPasswords();
}

async function deletePassword(id){

    if(!confirm("Delete password?"))
        return;

    await getSB()
        .from("passwords")
        .delete()
        .eq("id",id);

    loadPasswords();
}

async function copyPassword(value){

    navigator.clipboard.writeText(value);

    alert("Copied");
}

async function loadPasswords(){

    const user =
        await getUser();

    if(!user) return;

    const search =
        document.getElementById("searchBox")
        .value
        .toLowerCase();

    const { data } =
        await getSB()
        .from("passwords")
        .select("*")
        .eq("user_id",user.id)
        .order("website");

    const list =
        document.getElementById("vaultList");

    list.innerHTML = "";

    data.forEach(entry=>{

        if(
            search &&
            !entry.website
            .toLowerCase()
            .includes(search)
        ){
            return;
        }

        list.innerHTML += `

        <div class="vault-entry">

            <div class="entry-header">

                <h3>${entry.website}</h3>

                <strong>
                    ${entry.username || ""}
                </strong>

            </div>

            <div class="badge">

                ${entry.category || "Other"}

            </div>

            <p style="margin-top:10px">

                <span id="pw-${entry.id}"
                      class="hidden-password">

                    •••••••••••••••

                </span>

            </p>

            <p style="margin-top:8px">

                ${entry.notes || ""}

            </p>

            <div class="entry-actions">

                <button
                    class="action-btn show-btn"
                    onclick="togglePassword(${entry.id},'${entry.password_value.replace(/'/g,'&#39;')}')">

                    Show

                </button>

                <button
                    class="action-btn copy-btn"
                    onclick="copyPassword('${entry.password_value.replace(/'/g,'&#39;')}')">

                    Copy

                </button>

                <button
                    class="action-btn delete-btn"
                    onclick="deletePassword(${entry.id})">

                    Delete

                </button>

            </div>

        </div>
        `;
    });
}

function togglePassword(id,password){

    const el =
        document.getElementById(
            `pw-${id}`
        );

    if(el.innerText.includes("•")){

        el.innerText = password;

    }else{

        el.innerText =
            "•••••••••••••••";
    }
}

loadPasswords();

</script>

</body>
</html>
