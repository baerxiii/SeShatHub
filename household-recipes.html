<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SeShat Household Recipes</title>
<link rel="icon" type="image/svg+xml" href="./page-icons/household-recipes.svg">
<link rel="apple-touch-icon" href="./page-icons/household-recipes-180.png">
<link rel="manifest" href="./household-recipes.webmanifest">
<link rel="stylesheet" href="recipes.css">
</head>
<body data-recipe-type="household">
<main class="container">
    <header class="header">
        <h1>🧼 Household Recipes</h1>
        <a href="index.html" class="button">Dashboard</a>
    </header>
    <p>Keep recipes for homemade detergents, cleaners, and other household products. After saving a recipe, attach images or PDFs to it.</p>
    <button class="button create-button" id="createRecipe" type="button">Add Household Recipe</button>
    <section class="card" aria-label="Household recipes">
        <input id="searchBox" type="search" aria-label="Search recipes" placeholder="🔍 Search recipes">
        <p id="listMessage" role="status"></p>
        <div id="recipeList"></div>
    </section>
</main>
<dialog id="recipeDialog" aria-labelledby="dialogHeading">
    <form id="recipeForm">
        <h2 id="dialogHeading">Add Household Recipe</h2>
        <label>Recipe name <input id="title" required maxlength="200"></label>
        <label>Category <input id="category" placeholder="e.g. Laundry or Cleaning" maxlength="100"></label>
        <label>Ingredients and quantities <textarea id="ingredients"></textarea></label>
        <label>Instructions <textarea id="instructions"></textarea></label>
        <label>Notes and precautions <textarea id="notes"></textarea></label>
        <p id="formMessage" class="message" role="alert"></p>
        <div class="recipe-actions">
            <button type="submit" class="button" id="saveRecipe">Save Recipe</button>
            <button type="button" class="button cancel-button" id="cancelRecipe">Cancel</button>
        </div>
    </form>
</dialog>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="seshat-core.js"></script>
<script src="recipes.js"></script>
</body>
</html>
